name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar dependências
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Formatação
        run: ruff format --check .

      - name: Testes
        run: pytest
